<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Combate Showdown | 91Adrian91</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; padding: 20px 10px;
      display: flex; flex-direction: column; align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff;
      background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), 
                  url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=1920&auto=format&fit=crop');
      background-size: cover; background-position: center; background-attachment: fixed;
    }

    .nav-bar { display: flex; gap: 10px; background: rgba(15, 15, 30, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.15); padding: 10px 18px; border-radius: 30px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
    .nav-link { color: #a0a0d0; text-decoration: none; font-weight: bold; padding: 8px 14px; border-radius: 18px; transition: 0.3s; font-size: 0.85rem; }
    .nav-link:hover { color: #fff; background: rgba(255,255,255,0.1); }
    .nav-link.active { color: #000; background: linear-gradient(135deg, #ffd700, #ff8c00); }

    .main-container { width: 100%; max-width: 950px; background: rgba(18, 18, 30, 0.92); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.7); }

    /* MENU DE SELECCION */
    .mode-selector { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 20px; }
    .btn-mode { background: linear-gradient(135deg, #ff8c00, #ffd700); color: #000; border: none; padding: 15px 25px; border-radius: 12px; font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: 0.3s; width: 100%; max-width: 320px; box-shadow: 0 5px 15px rgba(255, 140, 0, 0.3); }
    .btn-mode:hover { transform: translateY(-3px); scale: 1.02; }

    /* TEAMPICKER */
    .team-picker { display: none; flex-direction: column; gap: 15px; }
    .search-box { display: flex; gap: 10px; justify-content: center; margin-bottom: 10px; }
    .input-poke { padding: 10px 15px; border-radius: 8px; border: 1px solid #555; background: #111; color: #fff; width: 250px; font-size: 1rem; }
    .btn-add { background: #ff8c00; color: #000; font-weight: bold; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; }
    .custom-team-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
    .custom-slot { background: rgba(255,255,255,0.05); border: 1px dashed #555; border-radius: 10px; height: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
    .custom-slot img { height: 60px; }
    .btn-remove { position: absolute; top: 4px; right: 6px; background: #f44336; border: none; color: #fff; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; font-size: 0.7rem; }

    /* ARENA SHOWDOWN */
    .battle-field { display: none; flex-direction: column; gap: 15px; }
    .arena { height: 320px; background: radial-gradient(circle at center, #2b4538 0%, #111e2e 100%); border-radius: 12px; position: relative; border: 1px solid rgba(255,255,255,0.2); overflow: hidden; box-shadow: inset 0 0 50px rgba(0,0,0,0.8); }
    
    .poke-stage { position: absolute; display: flex; flex-direction: column; align-items: center; width: 200px; }
    .stage-foe { top: 25px; right: 40px; }
    .stage-player { bottom: 15px; left: 40px; }

    .platform { position: absolute; bottom: 0; width: 160px; height: 30px; background: rgba(255,255,255,0.1); border-radius: 50%; z-index: 1; transform: scaleY(0.4); border: 2px solid rgba(255,255,255,0.2); }

    .status-bar { background: rgba(10, 10, 20, 0.85); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 6px 12px; width: 100%; font-size: 0.85rem; z-index: 5; }
    .hp-bg { background: #222; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 4px; border: 1px solid #444; }
    .hp-fill { background: #4CAF50; height: 100%; width: 100%; transition: width 0.4s ease-in-out; }

    /* SPRITES CON ANIMACION SHOWDOWN */
    .sprite-foe { height: 130px; z-index: 2; image-rendering: pixelated; filter: drop-shadow(0 10px 8px rgba(0,0,0,0.6)); }
    .sprite-player { height: 140px; z-index: 2; image-rendering: pixelated; filter: drop-shadow(0 10px 8px rgba(0,0,0,0.6)); }

    /* ANIMACION AL ATAQUE */
    .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    /* CONTROLES ESTILO SHOWDOWN */
    .battle-controls { display: grid; grid-template-columns: 2fr 1fr; gap: 15px; }
    .moves-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn-move { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; text-align: left; display: flex; flex-direction: column; justify-content: space-between; }
    .btn-move:hover { background: rgba(255,255,255,0.2); border-color: #ffd700; transform: scale(1.02); }
    .move-type { font-size: 0.7rem; color: #ffd700; text-transform: uppercase; margin-top: 4px; }

    .switch-team { display: flex; flex-direction: column; gap: 6px; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
    .btn-switch { background: rgba(255,255,255,0.05); border: 1px solid #444; color: #fff; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; text-align: left; display: flex; align-items: center; justify-content: space-between; }
    .btn-switch:hover { background: rgba(255,255,255,0.2); }
    .btn-switch img { height: 28px; }

    .log-box { background: #080810; border: 1px solid #222; height: 110px; border-radius: 8px; padding: 10px; font-family: monospace; font-size: 0.85rem; overflow-y: auto; color: #39ff14; margin-top: 10px; }

    @media (max-width: 600px) {
      .battle-controls { grid-template-columns: 1fr; }
      .stage-foe { right: 10px; }
      .stage-player { left: 10px; }
    }
  </style>
</head>
<body>

  <nav class="nav-bar">
    <a href="index.html" class="nav-link">⚔️ Equipo</a>
    <a href="minijuego.html" class="nav-link">🎮 ¿Quién es?</a>
    <a href="pokedle.html" class="nav-link">🧩 Pokedle</a>
    <a href="typematchup.html" class="nav-link">⚡ Type Matchup</a>
    <a href="batalla.html" class="nav-link active">⚔️ Combate</a>
  </nav>

  <div class="main-container">

    <!-- SELECCION DE MODO -->
    <div class="mode-selector" id="modeMenu">
      <h2 style="color: #ffd700;">⚔️ Simulador de Batalla Showdown</h2>
      <p style="color: #aaa;">Combate en tiempo real con Pokémon animados</p>
      <button class="btn-mode" onclick="startRandomBattle()">🎲 Batalla Aleatoria (Random Battle)</button>
      <button class="btn-mode" style="background: linear-gradient(135deg, #4b6cb7, #182848); color: #fff;" onclick="openCustomBuilder()">📝 Crear tu propio equipo</button>
    </div>

    <!-- SELECCIONADOR DE EQUIPO PROPIO -->
    <div class="team-picker" id="teamPicker">
      <h3 style="text-align:center; color:#ffd700;">Elige hasta 6 Pokémon</h3>
      <div class="search-box">
        <input type="text" id="pokeSearchInput" class="input-poke" placeholder="Ejemplo: Gengar, Lucario...">
        <button class="btn-add" onclick="addPokemonToCustom()">Añadir</button>
      </div>
      <div class="custom-team-list" id="customTeamList"></div>
      <button class="btn-mode" style="margin: 15px auto 0 auto;" onclick="startCustomBattle()">¡Empezar Combate! ⚔️</button>
    </div>

    <!-- ARENA DE COMBATE -->
    <div class="battle-field" id="battleField">
      <div class="arena">
        <!-- Oponente -->
        <div class="poke-stage stage-foe">
          <div class="status-bar">
            <span id="foeName" style="text-transform:capitalize; font-weight:bold;">Oponente</span> <span style="float:right; color:#ffd700;">Lv100</span>
            <div class="hp-bg"><div class="hp-fill" id="foeHpBar"></div></div>
          </div>
          <img id="foeSprite" class="sprite-foe" src="" alt="Foe">
          <div class="platform"></div>
        </div>

        <!-- Jugador -->
        <div class="poke-stage stage-player">
          <img id="playerSprite" class="sprite-player" src="" alt="Player">
          <div class="platform"></div>
          <div class="status-bar">
            <span id="playerName" style="text-transform:capitalize; font-weight:bold;">Jugador</span> <span style="float:right; color:#ffd700;">Lv100</span>
            <div class="hp-bg"><div class="hp-fill" id="playerHpBar"></div></div>
          </div>
        </div>
      </div>

      <!-- Controles -->
      <div class="battle-controls">
        <div class="moves-grid" id="movesGrid"></div>
        <div class="switch-team">
          <span style="font-size:0.75rem; color:#aaa; font-weight:bold; margin-bottom: 4px;">EQUIPO (CAMBIAR)</span>
          <div id="switchList" style="display:flex; flex-direction:column; gap:4px;"></div>
        </div>
      </div>

      <!-- Registro de combate -->
      <div class="log-box" id="battleLog"></div>
    </div>

  </div>

  <script>
    let playerTeam = [];
    let foeTeam = [];
    let activePlayerIdx = 0;
    let activeFoeIdx = 0;
    let customList = [];

    const moveDatabase = {
      fire: { name: 'Flamethrower', power: 90, type: 'fire' },
      water: { name: 'Surf', power: 90, type: 'water' },
      grass: { name: 'Energy Ball', power: 90, type: 'grass' },
      electric: { name: 'Thunderbolt', power: 90, type: 'electric' },
      ice: { name: 'Ice Beam', power: 90, type: 'ice' },
      fighting: { name: 'Close Combat', power: 120, type: 'fighting' },
      poison: { name: 'Sludge Bomb', power: 90, type: 'poison' },
      ground: { name: 'Earthquake', power: 100, type: 'ground' },
      flying: { name: 'Air Slash', power: 75, type: 'flying' },
      psychic: { name: 'Psychic', power: 90, type: 'psychic' },
      bug: { name: 'Bug Buzz', power: 90, type: 'bug' },
      rock: { name: 'Stone Edge', power: 100, type: 'rock' },
      ghost: { name: 'Shadow Ball', power: 80, type: 'ghost' },
      dragon: { name: 'Dragon Pulse', power: 85, type: 'dragon' },
      dark: { name: 'Dark Pulse', power: 80, type: 'dark' },
      steel: { name: 'Flash Cannon', power: 80, type: 'steel' },
      fairy: { name: 'Moonblast', power: 95, type: 'fairy' },
      normal: { name: 'Body Slam', power: 85, type: 'normal' }
    };

    async function fetchPokeData(idOrName) {
      try {
        const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${idOrName.toString().toLowerCase()}`);
        if (!res.ok) return null;
        const data = await res.json();
        
        const moves = data.types.map(t => moveDatabase[t.type.name] || moveDatabase.normal);
        while (moves.length < 4) moves.push(moveDatabase.normal);

        // ANIMACIONES GIF REALES SHOWDOWN DE ESPALDA Y FRENTE
        const frontGif = data.sprites.other.showdown.front_default || data.sprites.front_default;
        const backGif = data.sprites.other.showdown.back_default || data.sprites.back_default || frontGif;

        return {
          id: data.id,
          name: data.name,
          maxHp: data.stats[0].base_stat * 2 + 110,
          currentHp: data.stats[0].base_stat * 2 + 110,
          atk: data.stats[1].base_stat,
          def: data.stats[2].base_stat,
          spd: data.stats[5].base_stat,
          types: data.types.map(t => t.type.name),
          frontGif: frontGif,
          backGif: backGif,
          icon: data.sprites.front_default,
          moves: moves.slice(0, 4)
        };
      } catch {
        return null;
      }
    }

    async function startRandomBattle() {
      document.getElementById('modeMenu').style.display = 'none';
      log("Cargando Pokémon con animaciones...");

      const randomPlayerIds = Array.from({length: 6}, () => Math.floor(Math.random() * 500) + 1);
      const randomFoeIds = Array.from({length: 6}, () => Math.floor(Math.random() * 500) + 1);

      playerTeam = await Promise.all(randomPlayerIds.map(id => fetchPokeData(id)));
      foeTeam = await Promise.all(randomFoeIds.map(id => fetchPokeData(id)));

      initArena();
    }

    function openCustomBuilder() {
      document.getElementById('modeMenu').style.display = 'none';
      document.getElementById('teamPicker').style.display = 'flex';
      renderCustomSlots();
    }

    async function addPokemonToCustom() {
      if (customList.length >= 6) return alert("¡El equipo ya está lleno!");
      const val = document.getElementById('pokeSearchInput').value.trim();
      if (!val) return;

      const p = await fetchPokeData(val);
      if (!p) return alert("Pokémon no encontrado");

      customList.push(p);
      document.getElementById('pokeSearchInput').value = '';
      renderCustomSlots();
    }

    function removeCustom(idx) {
      customList.splice(idx, 1);
      renderCustomSlots();
    }

    function renderCustomSlots() {
      const container = document.getElementById('customTeamList');
      container.innerHTML = '';
      for (let i = 0; i < 6; i++) {
        const slot = document.createElement('div');
        slot.className = 'custom-slot';
        if (customList[i]) {
          slot.innerHTML = `
            <button class="btn-remove" onclick="removeCustom(${i})">✕</button>
            <img src="${customList[i].icon}">
            <span style="font-size:0.75rem; text-transform:capitalize;">${customList[i].name}</span>
          `;
        } else {
          slot.innerHTML = `<span style="color:#555; font-size:0.8rem;">Slot ${i+1}</span>`;
        }
        container.appendChild(slot);
      }
    }

    async function startCustomBattle() {
      if (customList.length === 0) return alert("Agrega al menos 1 Pokémon");
      playerTeam = customList;
      
      const randomFoeIds = Array.from({length: customList.length}, () => Math.floor(Math.random() * 500) + 1);
      foeTeam = await Promise.all(randomFoeIds.map(id => fetchPokeData(id)));

      document.getElementById('teamPicker').style.display = 'none';
      initArena();
    }

    function initArena() {
      document.getElementById('battleField').style.display = 'flex';
      activePlayerIdx = 0;
      activeFoeIdx = 0;
      updateField();
      log(`¡Comienza el combate Showdown! ¡Adelante ${playerTeam[0].name.toUpperCase()}!`);
    }

    function updateField() {
      const p = playerTeam[activePlayerIdx];
      const f = foeTeam[activeFoeIdx];

      document.getElementById('playerName').textContent = p.name;
      document.getElementById('playerSprite').src = p.backGif;
      const pPct = Math.max(0, (p.currentHp / p.maxHp) * 100);
      document.getElementById('playerHpBar').style.width = pPct + '%';

      document.getElementById('foeName').textContent = f.name;
      document.getElementById('foeSprite').src = f.frontGif;
      const fPct = Math.max(0, (f.currentHp / f.maxHp) * 100);
      document.getElementById('foeHpBar').style.width = fPct + '%';

      const movesContainer = document.getElementById('movesGrid');
      movesContainer.innerHTML = '';
      p.moves.forEach(m => {
        const btn = document.createElement('button');
        btn.className = 'btn-move';
        btn.innerHTML = `<span>${m.name}</span><span class="move-type">Tipo: ${m.type}</span>`;
        btn.onclick = () => executeTurn(m);
        if (p.currentHp <= 0) btn.disabled = true;
        movesContainer.appendChild(btn);
      });

      const switchContainer = document.getElementById('switchList');
      switchContainer.innerHTML = '';
      playerTeam.forEach((member, i) => {
        if (i === activePlayerIdx) return;
        const btn = document.createElement('button');
        btn.className = 'btn-switch';
        btn.innerHTML = `<span style="text-transform:capitalize;"><img src="${member.icon}" style="vertical-align:middle;"> ${member.name}</span> <span>${Math.round((member.currentHp/member.maxHp)*100)}%</span>`;
        btn.onclick = () => switchPokemon(i);
        if (member.currentHp <= 0) btn.disabled = true;
        switchContainer.appendChild(btn);
      });
    }

    function executeTurn(playerMove) {
      const p = playerTeam[activePlayerIdx];
      const f = foeTeam[activeFoeIdx];

      const foeMove = f.moves[Math.floor(Math.random() * f.moves.length)];

      if (p.spd >= f.spd) {
        attack(p, f, playerMove, 'foeSprite', () => {
          if (f.currentHp > 0) attack(f, p, foeMove, 'playerSprite', checkFaints);
          else checkFaints();
        });
      } else {
        attack(f, p, foeMove, 'playerSprite', () => {
          if (p.currentHp > 0) attack(p, f, playerMove, 'foeSprite', checkFaints);
          else checkFaints();
        });
      }
    }

    function attack(attacker, defender, move, targetSpriteId, callback) {
      log(`${attacker.name.toUpperCase()} usó ${move.name}!`);

      // EFECTO VISUAL DE AGITACIÓN
      const targetImg = document.getElementById(targetSpriteId);
      targetImg.classList.add('shake');
      setTimeout(() => targetImg.classList.remove('shake'), 400);

      const damage = Math.floor(((20 * move.power * (attacker.atk / defender.def)) / 50) + 2);
      defender.currentHp = Math.max(0, defender.currentHp - damage);

      new Audio(`https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/latest/${attacker.id}.ogg`).play().catch(()=>{});

      updateField();
      setTimeout(callback, 700);
    }

    function switchPokemon(newIdx) {
      if (playerTeam[newIdx].currentHp <= 0) return;
      activePlayerIdx = newIdx;
      log(`¡Vuelve! ¡Adelante ${playerTeam[activePlayerIdx].name.toUpperCase()}!`);
      
      const f = foeTeam[activeFoeIdx];
      const foeMove = f.moves[Math.floor(Math.random() * f.moves.length)];
      attack(f, playerTeam[activePlayerIdx], foeMove, 'playerSprite', checkFaints);
    }

    function checkFaints() {
      const p = playerTeam[activePlayerIdx];
      const f = foeTeam[activeFoeIdx];

      if (f.currentHp <= 0) {
        log(`¡${f.name.toUpperCase()} enemigo se ha debilitado!`);
        activeFoeIdx++;
        if (activeFoeIdx >= foeTeam.length) {
          log("🏆 ¡VICTORIA! Has derrotado al entrenador rival.");
          alert("🏆 ¡Has ganado la batalla Showdown!");
          return;
        } else {
          log(`El rival saca a ${foeTeam[activeFoeIdx].name.toUpperCase()}`);
        }
      }

      if (p.currentHp <= 0) {
        log(`¡Tu ${p.name.toUpperCase()} se ha debilitado!`);
        const aliveIdx = playerTeam.findIndex(m => m.currentHp > 0);
        if (aliveIdx === -1) {
          log("💀 DERROTA. Todos tus Pokémon se han debilitado.");
          alert("💀 Has sido derrotado.");
          return;
        }
      }
      updateField();
    }

    function log(msg) {
      const logBox = document.getElementById('battleLog');
      logBox.innerHTML += `<div>> ${msg}</div>`;
      logBox.scrollTop = logBox.scrollHeight;
    }
  </script>
</body>
</html>

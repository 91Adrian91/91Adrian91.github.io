<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>91Adrian91</title>
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
      background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                  url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=1920&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .card {
      background: rgba(20, 20, 35, 0.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 35px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      max-width: 500px;
      width: 90%;
    }

    h1 {
      margin: 0 0 20px 0;
      font-size: 2.2rem;
      letter-spacing: 1px;
      color: #e0e0ff;
      text-shadow: 0 0 10px rgba(180, 140, 255, 0.5);
    }

    /* Gliscor con GIF animado del juego */
    .gliscor-container {
      margin: 20px 0;
    }

    .gliscor-animated {
      width: 180px;
      height: auto;
      filter: drop-shadow(0 8px 15px rgba(0, 0, 0, 0.7));
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Froga bat</h1>

    <div class="gliscor-container">
      <!-- GIF animado oficial de Gliscor moviéndose -->
      <img class="gliscor-animated" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/472.gif" alt="Gliscor Animado">
    </div>
  </div>

</body>
</html>

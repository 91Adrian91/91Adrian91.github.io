<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>91Adrian91 | Trainer Card</title>
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
      background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                  url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=1920&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    /* Cabecera / Perfil */
    .header-profile {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      margin: 0;
      font-size: 2.8rem;
      letter-spacing: 2px;
      color: #e0e0ff;
      text-shadow: 0 0 15px rgba(180, 140, 255, 0.6);
    }

    .trainer-subtitle {
      color: #a0a0d0;
      font-size: 0.95rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 5px;
    }

    /* Botón Shiny */
    .shiny-btn {
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      border: none;
      color: #000;
      font-weight: bold;
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      margin-top: 15px;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .shiny-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.7);
    }

    /* Grid */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
      max-width: 950px;
      width: 100%;
    }

    /* Tarjeta Pokémon */
    .pokemon-card {
      background: rgba(20, 20, 35, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
      cursor: pointer;
      position: relative;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .pokemon-card:hover {
      transform: translateY(-8px);
      border-color: rgba(180, 140, 255, 0.5);
    }

    .pokemon-card.attack {
      animation: attackAnim 0.5s ease-in-out;
    }

    @keyframes attackAnim {
      0% { transform: scale(1); }
      30% { transform: scale(1.1) translateY(-10px); }
      100% { transform: scale(1); }
    }

    .pokemon-name {
      margin: 0 0 10px 0;
      font-size: 1.6rem;
      color: #ffffff;
    }

    /* Badges de Tipos */
    .types-container {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    .type-badge {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
    }

    .ground { background-color: #E0C068; color: #000; }
    .flying { background-color: #A98FF3; color: #000; }
    .ghost  { background-color: #705898; color: #fff; }
    .poison { background-color: #A040A0; color: #fff; }
    .dark   { background-color: #705848; color: #fff; }
    .ice    { background-color: #98D8D8; color: #000; }
    .steel  { background-color: #B8B8D0; color: #000; }
    .psychic{ background-color: #F85888; color: #fff; }
    .fairy  { background-color: #EE99AC; color: #000; }

    .pokemon-animated {
      height: 120px;
      width: auto;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.8));
      margin-bottom: 15px;
    }

    /* Mini Barra de Stats */
    .stats-container {
      width: 100%;
      margin-top: 10px;
      font-size: 0.75rem;
      color: #aaa;
    }

    .stat-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .stat-bar-bg {
      flex-grow: 1;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
    }

    .stat-bar-fill {
      height: 100%;
      background: #c8b6ff;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <div class="header-profile">
    <h1>91Adrian91</h1>
    <div class="trainer-subtitle">Master Pokémon Team</div>
    <button class="shiny-btn" onclick="toggleShiny()">✨ Modo Shiny / Variocolor</button>
  </div>

  <div class="grid-container">

    <!-- Gliscor -->
    <div class="pokemon-card" onclick="playCry(472, this)">
      <h2 class="pokemon-name">Gliscor</h2>
      <div class="types-container">
        <span class="type-badge ground">Tierra</span>
        <span class="type-badge flying">Volador</span>
      </div>
      <img class="pokemon-animated" id="poke-472" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/472.gif" alt="Gliscor">
      
      <div class="stats-container">
        <div class="stat-row"><span>HP</span><div class="stat-bar-bg"><div class="stat-bar-fill" style="width: 75%;"></div></div></div>
        <div class="stat-row"><span>ATK</span><div class="stat-bar-bg"><div class="stat-bar-fill" style="width: 85%;"></div></div></div>
        <div class="stat-row"><span>DEF</span><div class="stat-bar-bg"><div class="stat-bar-fill" style="width: 95%;"></div></div></div>
      </div>
    </div>

    <!-- Gengar -->
    <div class="pokemon-card" onclick="playCry(94, this)">
      <h2 class="pokemon-name">Gengar</h2>
      <div class="types-container">
        <span class="type-badge ghost">Fantasma</span>
        <span class="type-badge poison">Veneno</span>
      </div>
      <img class="pokemon-animated" id="poke-94" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/94.gif" alt="Gengar">
      
      <div class="stats-container">
        <div class="stat-row"><span>HP</span><div class="stat-bar-bg"><div class="stat-bar-fill" style="width: 60%;"></div></div></div>
        <div class="stat-row"><span>ATK</span><div class="stat-bar-bg"><div class="stat-bar-fill" style="width: 90%;"></div></div></div>
        <div class="stat-row"><span>SPD</span><div class="stat-bar-bg"><div class="stat-bar-fill" style="width: 88%;"></div></div></div>
      </div>
    </div>

    <!-- Darkrai -->
    <div class="pokemon-card" onclick="playCry(491, this)">
      <h2 class="pokemon-name">Darkrai</h2>
      <div class="types-container">
        <span class="type-badge dark">Siniestro</span>
      </div>
      <img class="pokemon-animated" id="poke-491" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/491.gif" alt="Darkrai">
      
      <div class="stats-container">
        <div class="stat-row"><span>HP</span><div class="stat-bar-bg"><div class="stat-bar-fill" style="width: 70%;"></div></div></div>
        <div class="stat-row"><span>ATK</span><div class="stat-bar-bg"><div class="stat-bar-fill" style="width: 95%;"></div></div></div>
        <div class="stat-row"><span>SPD</span><div class="stat-bar-bg"><div class="stat-bar-fill" style="width: 92%;"></div></div></div>
      </div>
    </div>

    <!-- Glalie -->
    <div class="pokemon-card" onclick="playCry(362, this)">
      <h2 class="pokemon-name">Glalie</h2>
      <div class="types-container">
        <span class="type-badge ice">Hielo</span>
      </div>
      <img class="pokemon-animated" id="poke-362" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/362.gif" alt="Glalie">
      
      <div class="stats-container">
        <div class="stat-row"><span>HP</span><div class="stat-bar-bg"><div class="stat-bar-fill" style="width: 80%;"></div></div></div>
        <div class="stat-row"><span>DEF</span><div class="stat-bar-bg"><div class="stat-bar-fill" style="width: 80%;"></div></div></div>
        <div class="stat-row"><span>SPD</span><div class="stat-bar-bg"><div class="stat-bar-fill" style="width: 80%;"></div></div></div>
      </div>
    </div>

    <!-- Metagross -->
    <div class="pokemon-card" onclick="playCry(376, this)">
      <h2 class="pokemon-name">Metagross</h2>
      <div class="types-container">
        <span class="type-badge steel">Acero</span>
        <span class="type-badge psychic">Psíquico</span>
      </div>
      <img class="pokemon-animated" id="poke-376" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/376.gif" alt="Metagross">
      
      <div class="stats-container">
        <div class="stat-row"><span>HP</span><div class="stat-bar-bg"><div class="stat-bar-fill" style="width: 80%;"></div></div></div>
        <div class="stat-row"><span>ATK</span><div class="stat-bar-bg"><div class="stat-bar-fill" style="width: 95%;"></div></div></div>
        <div class="stat-row"><span>DEF</span><div class="stat-bar-bg"><div class="stat-bar-fill" style="width: 90%;"></div></div></div>
      </div>
    </div>

    <!-- Mimikyu -->
    <div class="pokemon-card" onclick="playCry(778, this)">
      <h2 class="pokemon-name">Mimikyu</h2>
      <div class="types-container">
        <span class="type-badge ghost">Fantasma</span>
        <span class="type-badge fairy">Hada</span>
      </div>
      <img class="pokemon-animated" id="poke-778" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/778.gif" alt="Mimikyu">
      
      <div class="stats-container">
        <div class="stat-row"><span>HP</span><div class="stat-bar-bg"><div class="stat-bar-fill" style="width: 55%;"></div></div></div>
        <div class="stat-row"><span>ATK</span><div class="stat-bar-bg"><div class="stat-bar-fill" style="width: 80%;"></div></div></div>
        <div class="stat-row"><span>SPD</span><div class="stat-bar-bg"><div class="stat-bar-fill" style="width: 85%;"></div></div></div>
      </div>
    </div>

  </div>

  <script>
    let isShiny = false;
    const teamIds = [472, 94, 491, 362, 376, 778];

    // Reproducción de sonido y animación
    function playCry(id, cardElement) {
      const audio = new Audio(`https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/latest/${id}.ogg`);
      audio.volume = 0.5;
      audio.play();

      cardElement.classList.remove('attack');
      void cardElement.offsetWidth;
      cardElement.classList.add('attack');
    }

    // Cambiar entre Normal y Shiny
    function toggleShiny() {
      isShiny = !isShiny;
      const path = isShiny ? 'shiny' : 'showdown';

      teamIds.forEach(id => {
        const img = document.getElementById(`poke-${id}`);
        img.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/${isShiny ? 'shiny/' : ''}${id}.gif`;
      });
    }
  </script>

</body>
</html>

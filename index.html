<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>91Adrian91 | Pokémon Team</title>
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
      background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                  url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=1920&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .card {
      background: rgba(20, 20, 35, 0.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 35px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      max-width: 750px;
      width: 90%;
    }

    /* Layout en fila para colocar a los Pokémon lado a lado */
    .pokemon-container {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 40px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .pokemon-card {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .pokemon-name {
      margin: 0 0 15px 0;
      font-size: 2rem;
      letter-spacing: 2px;
      color: #e0e0ff;
      text-shadow: 0 0 12px rgba(180, 140, 255, 0.6);
    }

    /* Estilos de las imágenes animadas */
    .pokemon-animated {
      height: 180px;
      width: auto;
      object-fit: contain;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.8));
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="pokemon-container">
      
      <!-- Gliscor -->
      <div class="pokemon-card">
        <h2 class="pokemon-name">Gliscor</h2>
        <img class="pokemon-animated" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/472.gif" alt="Gliscor">
      </div>

      <!-- Gengar -->
      <div class="pokemon-card">
        <h2 class="pokemon-name">Gengar</h2>
        <img class="pokemon-animated" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/94.gif" alt="Gengar">
      </div>

    </div>
  </div>

</body>
</html>

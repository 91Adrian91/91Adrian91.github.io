<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>91Adrian91 | Gliscor</title>
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
      background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                  url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=1920&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .card {
      background: rgba(20, 20, 35, 0.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 35px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      max-width: 500px;
      width: 90%;
    }

    h1 {
      margin: 0 0 15px 0;
      font-size: 2.5rem;
      letter-spacing: 2px;
      color: #e0e0ff;
      text-shadow: 0 0 12px rgba(180, 140, 255, 0.6);
    }

    /* Contenedor del GIF */
    .gliscor-container {
      margin: 20px 0;
    }

    /* Imagen animada con renderizado nítido de alta calidad */
    .gliscor-animated {
      width: 220px;
      height: auto;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.8));
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Gliscor</h1>

    <div class="gliscor-container">
      <!-- GIF oficial animado en máxima resolución -->
      <img class="gliscor-animated" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/472.gif" alt="Gliscor">
    </div>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Equipo Pokémon | Creador Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; padding: 20px 10px;
      display: flex; flex-direction: column; align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff;
      background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), 
                  url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=1920&auto=format&fit=crop');
      background-size: cover; background-position: center; background-attachment: fixed;
    }

    .nav-bar { display: flex; gap: 10px; background: rgba(15, 15, 30, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.15); padding: 10px 18px; border-radius: 30px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
    .nav-link { color: #a0a0d0; text-decoration: none; font-weight: bold; padding: 8px 14px; border-radius: 18px; transition: 0.3s; font-size: 0.85rem; }
    .nav-link:hover { color: #fff; background: rgba(255,255,255,0.1); }
    .nav-link.active { color: #000; background: linear-gradient(135deg, #ffd700, #ff8c00); }

    .main-container { width: 100%; max-width: 1150px; background: rgba(18, 18, 30, 0.92); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.7); }
    
    header { text-align: center; margin-bottom: 25px; }
    header h1 { font-size: 2.2rem; color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.5); }
    header p { color: #aaa; font-size: 0.95rem; margin-top: 5px; }

    .search-box { display: flex; gap: 10px; justify-content: center; margin-bottom: 25px; }
    .search-box input { padding: 12px 18px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.5); color: #fff; font-size: 1rem; width: 60%; max-width: 350px; outline: none; }
    .search-box input:focus { border-color: #ffd700; }
    .search-box button { padding: 12px 24px; border-radius: 25px; border: none; background: linear-gradient(135deg, #ff8c00, #ffd700); color: #000; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .search-box button:hover { transform: scale(1.05); }

    .team-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 20px; }
    
    .slot { background: rgba(255,255,255,0.03); border: 2px dashed rgba(255,255,255,0.15); border-radius: 14px; padding: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 420px; position: relative; transition: 0.3s; }
    .slot.filled { border-style: solid; border-color: rgba(255,215,0,0.4); background: rgba(30, 30, 50, 0.6); justify-content: flex-start; }

    .sprite-container { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 8px 0; height: 100px; width: 100%; }
    .sprite-container img { height: 90px; max-width: 120px; object-fit: contain; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5)); }

    .sprite-controls { display: flex; gap: 8px; margin-bottom: 10px; }
    .btn-ctrl { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; cursor: pointer; transition: 0.2s; }
    .btn-ctrl:hover { background: rgba(255,255,255,0.25); }
    .btn-ctrl.active-shiny { background: #ffd700; color: #000; font-weight: bold; border-color: #ffd700; }

    .slot h3 { text-transform: capitalize; color: #fff; margin-bottom: 4px; font-size: 1.2rem; }
    
    .types { display: flex; gap: 6px; margin-bottom: 12px; }
    .type-tag { padding: 3px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; }

    .stats-container { width: 100%; background: rgba(0,0,0,0.3); border-radius: 8px; padding: 8px; margin-bottom: 10px; font-size: 0.75rem; }
    .stat-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .stat-row span { width: 55px; font-weight: bold; color: #aaa; }
    .stat-bar-bg { flex: 1; background: rgba(255,255,255,0.1); height: 8px; border-radius: 4px; margin: 0 8px; overflow: hidden; }
    .stat-bar-fill { height: 100%; background: #ffd700; border-radius: 4px; }
    .iv-input { width: 42px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); color: #ffd700; text-align: center; border-radius: 4px; font-size: 0.75rem; }

    .moves-section { width: 100%; background: rgba(0,0,0,0.3); border-radius: 8px; padding: 8px; }
    .moves-title { font-size: 0.8rem; color: #ffd700; font-weight: bold; margin-bottom: 6px; text-align: center; }
    .move-select { width: 100%; background: rgba(15, 15, 30, 0.9); color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; padding: 4px 6px; margin-bottom: 4px; font-size: 0.75rem; outline: none; }

    .btn-remove { position: absolute; top: 10px; right: 10px; background: rgba(255,68,68,0.2); border: 1px solid #ff4444; color: #ff4444; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .btn-remove:hover { background: #ff4444; color: #fff; }

    .type-normal { background: #A8A878; color: #000; }
    .type-fire { background: #F08030; color: #fff; }
    .type-water { background: #6890F0; color: #fff; }
    .type-grass { background: #78C850; color: #000; }
    .type-electric { background: #F8D030; color: #000; }
    .type-ice { background: #98D8D8; color: #000; }
    .type-fighting { background: #C03028; color: #fff; }
    .type-poison { background: #A040A0; color: #fff; }
    .type-ground { background: #E0C068; color: #000; }
    .type-flying { background: #A890F0; color: #fff; }
    .type-psychic { background: #F85888; color: #fff; }
    .type-bug { background: #A8B820; color: #000; }
    .type-rock { background: #B8A038; color: #fff; }
    .type-ghost { background: #705598; color: #fff; }
    .type-dragon { background: #7038F8; color: #fff; }
    .type-dark { background: #705848; color: #fff; }
    .type-steel { background: #B8B8D0; color: #000; }
    .type-fairy { background: #EE99AC; color: #000; }
  </style>
</head>
<body>

  <nav class="nav-bar">
    <a href="index.html" class="nav-link active">⚔️ Equipo</a>
    <a href="minijuego.html" class="nav-link">🎮 ¿Quién es?</a>
    <a href="pokedle.html" class="nav-link">🧩 Pokedle</a>
    <a href="typematchup.html" class="nav-link">⚡ Type Matchup</a>
    <a href="batalla.html" class="nav-link">⚔️ Combate</a>
  </nav>

  <div class="main-container">
    <header>
      <h1>🛡️ Creador Avanzado de Equipos</h1>
      <p>Sprites animados, versión Shiny, IVs y movimientos integrados</p>
    </header>

    <div class="search-box">
      <input type="text" id="pokeInput" placeholder="Nombre o ID del Pokémon...">
      <button onclick="addPokemon()">Añadir al Equipo</button>
    </div>

    <div class="team-grid" id="teamGrid"></div>
  </div>

  <script>
    const DEFAULT_TEAM_NAMES = ['gliscor', 'gengar', 'mimikyu', 'metagross', 'darkrai', 'glalie'];
    let team = JSON.parse(localStorage.getItem('myPokeTeam')) || [];

    async function fetchPokemon(query) {
      try {
        const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${query.toLowerCase()}`);
        if (!response.ok) return null;
        return await response.json();
      } catch (err) {
        return null;
      }
    }

    async function loadDefaultTeamIfEmpty() {
      if (team.length === 0) {
        for (const name of DEFAULT_TEAM_NAMES) {
          const data = await fetchPokemon(name);
          if (data) {
            const animFront = data.sprites.versions?.['generation-v']?.['black-white']?.animated?.front_default || data.sprites.front_default;
            const animBack = data.sprites.versions?.['generation-v']?.['black-white']?.animated?.back_default || data.sprites.back_default || animFront;
            const animShinyFront = data.sprites.versions?.['generation-v']?.['black-white']?.animated?.front_shiny || data.sprites.front_shiny || animFront;
            const animShinyBack = data.sprites.versions?.['generation-v']?.['black-white']?.animated?.back_shiny || data.sprites.back_shiny || animBack;
            const allMoves = data.moves.map(m => m.move.name);

            team.push({
              id: data.id,
              name: data.name,
              isShiny: false,
              sprites: { front: animFront, back: animBack, shinyFront: animShinyFront, shinyBack: animShinyBack },
              types: data.types.map(t => t.type.name),
              stats: data.stats.map(s => ({ name: s.stat.name, base: s.base_stat })),
              ivs: { hp: 31, attack: 31, defense: 31, 'special-attack': 31, 'special-defense': 31, speed: 31 },
              allAvailableMoves: allMoves,
              selectedMoves: allMoves.slice(0, 4)
            });
          }
        }
        saveTeam();
        renderTeam();
      }
    }

    async function addPokemon() {
      if (team.length >= 6) {
        alert("¡Tu equipo ya tiene 6 Pokémon!");
        return;
      }

      const input = document.getElementById('pokeInput');
      const val = input.value.trim();
      if (!val) return;

      const data = await fetchPokemon(val);
      if (!data) {
        alert("Pokémon no encontrado.");
        return;
      }

      const animFront = data.sprites.versions?.['generation-v']?.['black-white']?.animated?.front_default || data.sprites.front_default;
      const animBack = data.sprites.versions?.['generation-v']?.['black-white']?.animated?.back_default || data.sprites.back_default || animFront;
      const animShinyFront = data.sprites.versions?.['generation-v']?.['black-white']?.animated?.front_shiny || data.sprites.front_shiny || animFront;
      const animShinyBack = data.sprites.versions?.['generation-v']?.['black-white']?.animated?.back_shiny || data.sprites.back_shiny || animBack;

      const allMoves = data.moves.map(m => m.move.name);

      team.push({
        id: data.id,
        name: data.name,
        isShiny: false,
        sprites: { front: animFront, back: animBack, shinyFront: animShinyFront, shinyBack: animShinyBack },
        types: data.types.map(t => t.type.name),
        stats: data.stats.map(s => ({ name: s.stat.name, base: s.base_stat })),
        ivs: { hp: 31, attack: 31, defense: 31, 'special-attack': 31, 'special-defense': 31, speed: 31 },
        allAvailableMoves: allMoves,
        selectedMoves: allMoves.slice(0, 4)
      });

      saveTeam();
      renderTeam();
      input.value = '';
    }

    function removePokemon(index) {
      team.splice(index, 1);
      saveTeam();
      renderTeam();
    }

    function toggleShiny(index) {
      team[index].isShiny = !team[index].isShiny;
      saveTeam();
      renderTeam();
    }

    function updateIV(pokeIndex, statName, value) {
      let val = parseInt(value) || 0;
      if (val < 0) val = 0;
      if (val > 31) val = 31;
      team[pokeIndex].ivs[statName] = val;
      saveTeam();
    }

    function updateMove(pokeIndex, moveIndex, selectedMoveName) {
      team[pokeIndex].selectedMoves[moveIndex] = selectedMoveName;
      saveTeam();
    }

    function saveTeam() {
      localStorage.setItem('myPokeTeam', JSON.stringify(team));
    }

    function renderTeam() {
      const grid = document.getElementById('teamGrid');
      grid.innerHTML = '';

      for (let i = 0; i < 6; i++) {
        const poke = team[i];
        const slot = document.createElement('div');

        if (poke) {
          slot.className = 'slot filled';

          const frontImg = poke.isShiny ? poke.sprites.shinyFront : poke.sprites.front;
          const backImg = poke.isShiny ? poke.sprites.shinyBack : poke.sprites.back;

          const statsHTML = poke.stats.map(s => {
            const shortName = s.name.replace('special-attack', 'SpA').replace('special-defense', 'SpD').replace('attack', 'Atk').replace('defense', 'Def').replace('speed', 'Spe').toUpperCase();
            const ivVal = (poke.ivs && poke.ivs[s.name] !== undefined) ? poke.ivs[s.name] : 31;
            const percentage = Math.min(100, (s.base / 150) * 100);

            return `
              <div class="stat-row">
                <span>${shortName}${s.base}</span>
                <div class="stat-bar-bg
